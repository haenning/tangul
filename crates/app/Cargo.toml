[package]
name = "tangul"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false }
async-channel.workspace = true
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-sql"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
serde_json = "1.0.151"
tangul-ai = { path = "../ai" }
tangul-assist = { path = "../assist" }
tangul-core = { path = "../core" }
tangul-data = { path = "../data" }
tangul-engine = { path = "../engine" }
tangul-service = { path = "../service" }
# Only for the demo: its frames as PNG.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# `make demo`: records the README animation (TANGUL_DEMO=<frames dir>).
demo = ["gpui-kit/test-support", "dep:image"]

[dev-dependencies]
async-trait.workspace = true
# UI tests: headless windows driven by clicks and keys (see workspace/ui_tests.rs).
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-sql", "test-support"] }

[lints]
workspace = true
