[package]
name = "tangul-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
# The OS's TLS and trust store, like the drivers (native-tls).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream", "http2"] }
serde.workspace = true
serde_json = "1.0.151"
tangul-core = { path = "../core" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints]
workspace = true
