# Databases for the docker-compose dev setup. `make run-dev` copies this file to
# target/dev-config/ (once) and points the app there, so your real profiles are untouched.
# No passwords: the dev databases use passwordless auth.

[[databases]]
id = "dev-postgres"
name = "dev postgres (docker)"
driver = "postgres"
host = "127.0.0.1"
port = 55432
database = "postgres"
tls = "disable"

[[databases.users]]
id = "dev-postgres"
user = "postgres"

[[databases]]
id = "dev-mysql"
name = "dev mysql (docker)"
driver = "mysql"
host = "127.0.0.1"
port = 53306
database = "app"
tls = "disable"

[[databases.users]]
id = "dev-mysql"
user = "root"

# The dev Postgres again, reached through the SSH bastion from docker-compose
# (ssh password: tangul — enter it once via "Edit database…"; it goes to the Keychain).
[[databases]]
id = "dev-postgres-ssh"
name = "dev postgres via ssh"
driver = "postgres"
host = "postgres"
port = 5432
database = "postgres"
tls = "disable"

[databases.ssh]
host = "127.0.0.1"
port = 52222
user = "tangul"
auth = "password"

[[databases.users]]
id = "dev-postgres-ssh"
user = "postgres"
