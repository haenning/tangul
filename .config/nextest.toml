# cargo-nextest (CI): every test in its own process, all crates in one run.
# `cargo llvm-cov nextest --profile ci` measures coverage in the same run.

[profile.ci]
# Run everything, so one failure doesn't hide others.
fail-fast = false
# The live tests take a while (time limits, lock waits); anything slower is stuck.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
