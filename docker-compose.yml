# Local test databases. Integration tests:
#   RUSDB_TEST_PG=postgres:postgres@127.0.0.1:5432/postgres \
#   RUSDB_TEST_MYSQL=rusdb:rusdb@127.0.0.1:3306/app cargo test -p rusdb-engine
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: rusdb
      MYSQL_PASSWORD: rusdb
    ports: ["3306:3306"]
  # TODO(ssh): openssh-server container for tunnel tests.
