[workspace]
resolver = "2"
members = ["crates/core", "crates/drivers", "crates/engine", "crates/assist", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
rusdb-core = { path = "crates/core" }
rusdb-drivers = { path = "crates/drivers" }
rusdb-engine = { path = "crates/engine" }
rusdb-assist = { path = "crates/assist" }

anyhow = "1"
async-trait = "0.1"
async-channel = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"

# Deps optimized in dev so the GPU UI stays usable in debug builds; own code compiles fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
