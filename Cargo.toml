[workspace]
resolver = "2"
members = ["crates/core", "crates/drivers", "crates/engine", "crates/assist", "crates/tunnel", "crates/data", "crates/service", "crates/ai", "crates/llm", "crates/app"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "AGPL-3.0-only"
# Not published to crates.io; also keeps them out of the third-party license checks.
publish = false

[workspace.dependencies]
tangul-core = { path = "crates/core" }
tangul-drivers = { path = "crates/drivers" }
tangul-data = { path = "crates/data" }
tangul-service = { path = "crates/service" }
tangul-engine = { path = "crates/engine" }
tangul-assist = { path = "crates/assist" }

anyhow = "1"
async-trait = "0.1"
async-channel = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"

# Deps optimized in dev so the GPU UI stays usable in debug builds; own code compiles fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# Shared lint rules; each crate opts in with `[lints] workspace = true`.
# `make lint` / CI run clippy with warnings as errors.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Logs go to stderr; stdout stays clean.
print_stdout = "warn"
mem_forget = "warn"
needless_collect = "warn"
redundant_clone = "warn"
