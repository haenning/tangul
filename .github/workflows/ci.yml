name: CI

# Every crate's tests in one run, coverage measured in that same run, on Linux (the
# app's UI tests run headless there too), plus the updater on macOS. Jobs side by side:
# - checks: format, clippy, dependencies, and that docs/TESTING.md names real tests
# - tests: all tests with cargo-nextest under cargo-llvm-cov, the live ones against
#   Postgres, MySQL and the SSH bastion (docker-compose.yml); the report goes to the
#   run page and, from a dev → main pull request that passes, to the `badges` branch
#   (badges, tests.json, summary.md)
# - update-macos: the updater's tests where its install runs, every update that must
#   never be installed among them
#
# Tested once per step, before it is taken: a pull request's run tests its merge
# into the target (what the target becomes). Into dev: each change; dev → main: all
# of them together. Merging tests nothing again, nor does a release (release.yml).
#
# Caches: GitHub saves them only from pushes (a pull request's own is for it alone).
# A push to main builds what checks and tests build, runs nothing, and saves that
# (WARM); pull requests restore it. The system libraries are cached too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # A push to main: only build and save the caches (its code was tested as the
  # pull request into main).
  WARM: ${{ github.event_name == 'push' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: coverage doesn't need it, and it makes linking and the cache
  # much bigger.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # What GPUI links against on Linux.
  LINUX_LIBS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.LINUX_LIBS }}
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: env.WARM != 'true'
        with:
          tool: cargo-deny,cargo-machete
      - name: Format
        if: env.WARM != 'true'
        run: cargo fmt --all --check
      # WARM: the build for the cache.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependencies (advisories, licenses, sources)
        if: env.WARM != 'true'
        run: cargo deny check
      - name: Unused dependencies
        if: env.WARM != 'true'
        run: cargo machete
      - name: docs/TESTING.md names tests that exist
        if: env.WARM != 'true'
        run: python3 scripts/check-testing-doc.py docs/TESTING.md

  # The updater on macOS: real signatures, a test keychain and real DMGs, every update
  # that must never be installed (crates/update/src/install/attacks.rs).
  update-macos:
    # Pull requests only: one crate, quick to build without a cache.
    if: github.event_name != 'push'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: tangul-update's tests
        run: cargo test -p tangul-update

  tests:
    runs-on: ubuntu-latest
    # A build without cache (the first run, a changed Cargo.lock) takes most of it.
    timeout-minutes: 50
    permissions:
      contents: write # the badges branch, from a dev → main pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pulled and started in the background, so they boot while the rest is set
      # up; the "ready" step below waits for them before the tests.
      - name: Databases and SSH bastion (start)
        if: env.WARM != 'true'
        run: (docker compose up -d > "$RUNNER_TEMP/compose.log" 2>&1; echo $? > "$RUNNER_TEMP/compose.status") &
      - name: System libraries
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: ${{ env.LINUX_LIBS }}
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests
          # Keep the build even when a test fails, so the next run starts warm.
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      # WARM: the same build as the tests, none run.
      - name: Build for the cache
        if: env.WARM == 'true'
        run: cargo llvm-cov nextest --workspace --profile ci --no-report -E 'none()' --no-tests=pass
      - name: Databases and SSH bastion (ready)
        if: env.WARM != 'true'
        run: |
          while [ ! -f "$RUNNER_TEMP/compose.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/compose.log"
          [ "$(cat "$RUNNER_TEMP/compose.status")" = 0 ]
          docker compose up -d --wait
      - name: Tests with coverage (incl. live and UI tests)
        if: env.WARM != 'true'
        env:
          TANGUL_TEST_PG: postgres:@127.0.0.1:55432/postgres
          TANGUL_TEST_MYSQL: root:@127.0.0.1:53306/app
          TANGUL_TEST_SSH: tangul:tangul@127.0.0.1:52222
        run: cargo llvm-cov nextest --workspace --profile ci --no-report
      - name: Report
        if: always() && env.WARM != 'true'
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json || true
          cargo llvm-cov report --html --output-dir coverage-html || true
          junit=$(find target -path '*nextest/ci/junit.xml' | head -1)
          python3 scripts/test-report.py coverage.json "${junit:-none}" docker-compose.yml report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.WARM != 'true'
        with:
          name: test-report
          path: |
            report
            coverage-html/html
      # What main becomes: the passing dev → main pull request of this repository.
      - name: Publish report (dev → main)
        if: >-
          success() && github.event_name == 'pull_request'
          && github.base_ref == 'main' && github.head_ref == 'dev'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cd report
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Test report for dev ${HEAD_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
      - name: Stop databases
        if: always() && env.WARM != 'true'
        run: docker compose down -v
