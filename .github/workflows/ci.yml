name: CI

# Every crate's tests in one run, coverage measured in that same run, on Linux (the
# app's UI tests run headless there too). Two jobs side by side:
# - checks: format, clippy, dependencies, and that docs/TESTING.md names real tests
# - tests: all tests with cargo-nextest under cargo-llvm-cov, the live ones against
#   Postgres, MySQL and the SSH bastion (docker-compose.yml); the report goes to the
#   run page and, on main, to the `badges` branch (badges, tests.json, summary.md)
# Releases call this workflow before they build (release.yml).
#
# Caches: only pushes to dev and main save them (pull requests restore their base
# branch's), so the repo's 10 GB hold dev's and main's and none get evicted for a
# pull request's copy. The system libraries are cached too.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: coverage doesn't need it, and it makes linking and the cache
  # much bigger.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # What GPUI links against on Linux.
  LINUX_LIBS: >-
    libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
    libfontconfig-dev libfreetype-dev libvulkan-dev

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.LINUX_LIBS }}
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Dependencies (advisories, licenses, sources)
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete
      - name: docs/TESTING.md names tests that exist
        run: python3 scripts/check-testing-doc.py docs/TESTING.md

  tests:
    runs-on: ubuntu-latest
    # A build without cache (the first run, a changed Cargo.lock) takes most of it.
    timeout-minutes: 50
    permissions:
      contents: write # the badges branch, on main
    steps:
      - uses: actions/checkout@v4
      # Pulled and started in the background, so they boot while the rest is set
      # up; the "ready" step below waits for them before the tests.
      - name: Databases and SSH bastion (start)
        run: (docker compose up -d > "$RUNNER_TEMP/compose.log" 2>&1; echo $? > "$RUNNER_TEMP/compose.status") &
      - name: System libraries
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ${{ env.LINUX_LIBS }}
      - name: Install toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          # Keep the build even when a test fails, so the next run starts warm.
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' }}
      - name: Databases and SSH bastion (ready)
        run: |
          while [ ! -f "$RUNNER_TEMP/compose.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/compose.log"
          [ "$(cat "$RUNNER_TEMP/compose.status")" = 0 ]
          docker compose up -d --wait
      - name: Tests with coverage (incl. live and UI tests)
        env:
          TANGUL_TEST_PG: postgres:@127.0.0.1:55432/postgres
          TANGUL_TEST_MYSQL: root:@127.0.0.1:53306/app
          TANGUL_TEST_SSH: tangul:tangul@127.0.0.1:52222
        run: cargo llvm-cov nextest --workspace --profile ci --no-report
      - name: Report
        if: always()
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json || true
          cargo llvm-cov report --html --output-dir coverage-html || true
          junit=$(find target -path '*nextest/ci/junit.xml' | head -1)
          python3 scripts/test-report.py coverage.json "${junit:-none}" docker-compose.yml report
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            report
            coverage-html/html
      - name: Publish report (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd report
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Test report for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
      - name: Stop databases
        if: always()
        run: docker compose down -v
