name: CLA

# Every pull request: each commit author has agreed to the CLA (CLA.md) by commenting
# the sentence below once. Signatures are kept in signatures/cla.json on the
# `cla-signatures` branch (not protected; the action commits there).
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA (CLA.md) and agree to it for this and all my future contributions.'))
    steps:
      # pull_request_target runs this workflow as it is on the base branch and never
      # checks out the pull request's code.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/haenning/tangul/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer, commits by Claude Code sessions, and bots.
          allowlist: haenning,Claude,*[bot]
          custom-pr-sign-comment: I have read the CLA (CLA.md) and agree to it for this and all my future contributions.
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please agree to the
            [Contributor License Agreement](https://github.com/haenning/tangul/blob/main/CLA.md)
            by commenting the sentence below (once is enough for all your future
            contributions). You keep the copyright in your work.
          custom-allsigned-prcomment: Everyone here has agreed to the CLA. Thank you!
          lock-pullrequest-aftermerge: false
