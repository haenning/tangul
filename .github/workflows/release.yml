name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build a universal
# macOS DMG and publish it as a GitHub release. See CONTRIBUTING.md → Releases.
#
# Signed with the certificate in the `release` environment's secrets
# (scripts/release-keychain.sh lists them): a Developer ID also gets the hardened
# runtime, notarization and stapling; a self-signed one (release-signing-cert.sh)
# only a stable signature. Missing secrets fail the job before anything is built,
# unless the repository variable UNSIGNED_RELEASE is "true": then it is ad-hoc signed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every test first (the same run as on main); nothing is built if one fails.
  ci:
    uses: ./.github/workflows/ci.yml

  dmg:
    needs: ci
    # macOS 26 image: Xcode 26's actool compiles the Icon Composer icon (light/dark).
    # bundle-macos.sh falls back to the PNG icon if it isn't available.
    runs-on: macos-26
    environment: release
    # Notarization usually takes minutes, sometimes more.
    timeout-minutes: 90
    env:
      SIGNED: ${{ vars.UNSIGNED_RELEASE != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Metal toolchain (GPUI compiles its shaders at build time)
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "tangul"))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-about
      - name: Licenses (the app ships THIRD_PARTY_LICENSES.md)
        run: make license-check
      - name: Signing certificate and notary key (temporary keychain)
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release-keychain.sh setup
      - name: Build universal app + DMG
        run: scripts/bundle-macos.sh --universal
      - name: Notarize and staple
        if: env.SIGNED == 'true' && env.NOTARIZE == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize-macos.sh target/bundle/tangul-*-universal.dmg
      # The DMG's signature as a file of its own (<dmg>.sig), over its final bytes:
      # what the updater checks before it mounts a download. A signature inside
      # the DMG makes Gatekeeper check it when opened, which a self-signed one fails.
      - name: Detached signature for the updater
        if: env.SIGNED == 'true'
        run: |
          dmg=$(ls target/bundle/tangul-*-universal.dmg)
          codesign --sign "$TANGUL_SIGN_IDENTITY" --identifier io.github.haenning.tangul.dmg \
            --timestamp=none --detached "$dmg.sig" "$dmg"
      - name: Verify signature (and notarization)
        if: env.SIGNED == 'true'
        run: |
          app=target/bundle/tangul.app
          dmg=$(ls target/bundle/tangul-*-universal.dmg)
          codesign --verify --deep --strict --verbose=2 "$app"
          # The designated requirement (Team ID, or the certificate's hash): what
          # keeps the Keychain's "Always Allow" across releases.
          codesign -d -r- "$app"
          # The DMG, signed like the app: the updater checks it before mounting.
          codesign --verify --strict --verbose=2 --detached "$dmg.sig" "$dmg"
          codesign -d -r- --detached "$dmg.sig" "$dmg"
          # Signed inside too until v0.2.6, for v0.2.4's updater.
          codesign --verify --strict --verbose=2 "$dmg"
          if [ "$NOTARIZE" = true ]; then
            spctl -a -t exec -vv "$app"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
            xcrun stapler validate "$dmg"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/bundle/tangul-*-universal.dmg* \
            --title "tangul $GITHUB_REF_NAME" --generate-notes
      - name: Remove the keychain and keys
        if: always()
        run: scripts/release-keychain.sh cleanup || true
