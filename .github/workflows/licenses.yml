name: Licenses

# Every pull request into main: own crates are AGPL-3.0-only, dependencies only use
# allowed licenses (deny.toml) and THIRD_PARTY_LICENSES.md is up to date (make license).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny,cargo-about@0.9.3
      - name: make license-check
        run: make license-check
