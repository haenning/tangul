name: Licenses

# Every pull request into main: own crates are AGPL-3.0-only, dependencies only use
# allowed licenses (deny.toml) and THIRD_PARTY_LICENSES.md is up to date (make license).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny,cargo-about
      - name: make license-check
        run: make license-check
