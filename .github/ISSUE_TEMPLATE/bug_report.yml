name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: rusdb version / commit
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: PostgreSQL 16, MySQL 8.4, …
  - type: dropdown
    id: ssh
    attributes:
      label: Through an SSH tunnel?
      options: ["No", "Yes"]
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26, Apple M3
